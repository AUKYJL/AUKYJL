name: Update README Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update-readme-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh README activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update-readme-activity.py

      - name: Commit README activity changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README activity is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README activity"
          git push
