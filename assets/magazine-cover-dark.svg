<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AUKYJL Developer Magazine Cover Dark</title>
  <desc id="desc">Editorial GitHub profile cover introducing AUKYJL as a fullstack developer focused on React, Next.js, TypeScript, NestJS, and PostgreSQL.</desc>
  <rect width="1200" height="520" fill="#0D1117"/>
  <rect x="16" y="16" width="1168" height="488" rx="10" fill="none" stroke="#30363D"/>
  <text x="48" y="68" fill="#8B949E" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20">001</text>
  <text x="1068" y="68" fill="#F0F6FC" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" letter-spacing="1.8">AUKYJL / 2026</text>
  <text x="48" y="212" fill="#F0F6FC" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="122" letter-spacing="2">AUKYJL</text>
  <text x="48" y="304" fill="#F0F6FC" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="62" letter-spacing="1.5">FULLSTACK</text>
  <text x="48" y="372" fill="#F0F6FC" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="62" letter-spacing="1.5">DEVELOPER</text>
  <text x="52" y="424" fill="#F0F6FC" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="28">
    <tspan x="52" dy="0">I build web products with</tspan>
    <tspan x="52" dy="34">React, Next.js, TypeScript</tspan>
    <tspan x="52" dy="34">and NestJS.</tspan>
  </text>
  <g transform="translate(748 132)">
    <text x="0" y="0" fill="#F0F6FC" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" letter-spacing="0.6">INTERFACE / React / TypeScript</text>
    <line x1="0" y1="24" x2="324" y2="24" stroke="#30363D"/>
    <text x="0" y="74" fill="#F0F6FC" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" letter-spacing="0.6">WEB / Next.js</text>
    <line x1="0" y1="98" x2="324" y2="98" stroke="#30363D"/>
    <text x="0" y="148" fill="#F0F6FC" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" letter-spacing="0.6">BACKEND / NestJS / PostgreSQL</text>
    <line x1="0" y1="172" x2="324" y2="172" stroke="#30363D"/>
  </g>
  <text x="748" y="452" fill="#58A6FF" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" letter-spacing="1.4">GITHUB / AUKYJL</text>
