    </text>
    <text x="22" y="122" fill="#58A6FF" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" letter-spacing="0.35">
      <tspan x="22" dy="0">VIEW REPOSITORY ↗</tspan>
    </text>
  </g>

  <g transform="translate(332 214)">
    <rect x="0" y="0" width="352" height="148" fill="none" stroke="#8B949E" stroke-width="1.2"/>
    <text x="22" y="42" fill="#F0F6FC" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="30" letter-spacing="1">RIALTORG V2</text>
    <text x="22" y="72" fill="#8B949E" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14">
