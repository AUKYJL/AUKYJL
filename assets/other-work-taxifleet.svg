    <tspan x="24" dy="20">NestJS / PostgreSQL</tspan>
  </text>
  <line x1="24" y1="188" x2="336" y2="188" stroke="#30363D"/>
  <text x="24" y="209" fill="#58A6FF" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" letter-spacing="0.4">VIEW FRONTEND ↗</text>
